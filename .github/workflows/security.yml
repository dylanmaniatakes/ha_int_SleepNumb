name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:python"

  python-security:
    name: Python static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # bandit 1.8.6 (the version pinned in the HA SOC reference design) crashes
      # on Python 3.14's AST (ast.Constant no longer aliases .s); 1.9.4 is the
      # first release that scans clean under 3.14.
      - name: Install pinned scanner
        run: pip install "bandit==1.9.4"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Bandit medium/high findings
        run: bandit -q -r custom_components/sleepnumber_pro -ll
